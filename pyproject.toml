[project]
name = "hmmer-api"
version = "0.1.0"
description = "API for the Hmmer Web Service."
authors = [{ name = "Aleksandar Rajkovic", email = "aleksandar@ebi.ac.uk" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django-ninja>=1.6.2",
    "django>=5.2",
    "celery>=5.4.0",
    "dj-database-url>=2.3.0",
    "django-cache-url>=3.4.6",
    "redis>=5.2.0",
    "jsonpickle>=4.1.1",
    "pyhmmer>=0.10.15",
    "pydantic-settings>=2.6.1",
    "django-celery-results>=2.6.0",
    "orjson>=3.10.12",
    "django-cors-headers>=4.9.0",
    "django-unfold>=0.94.0",
    "django-treebeard>=4.7.1",
    "numpy>=2.2.2",
    "gunicorn>=23.0.0",
    "construct-typing>=0.7.0",
    "django-prometheus>=2.4.1",
    "gevent>=25.4.2",
    "cython>=3.2.4",
    "django-templated-email>=3.1.1",
    "html2text>=2025.4.15",
    "email-validator>=2.2.0",
    "flower>=2.0.1",
    "psycopg2-binary>=2.9.12",
    "portion>=2.6.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8-pyproject>=1.2.4",
    "flake8>=7.1.1",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.0",
    "testcontainers[postgres,redis]>=4.14.1",
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hmmerapi.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*", "*Tests", "*TestCase"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers --import-mode=importlib"
markers = ["worker: tests that require a real Celery worker (no eager mode)"]
