version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      django-patches:
        applies-to: version-updates
        patterns:
          - "dj*"
        update-types:
          - "minor"
          - "patch"
      other-patches:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "dj*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
