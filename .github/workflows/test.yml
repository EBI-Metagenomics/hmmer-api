name: Test

on:
  pull_request:
    branches:
      - main
      - development
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Check Django configuration
        run: uv run --frozen python manage.py check

      - name: Check Gunicorn configuration
        run: uv run --frozen gunicorn --check-config hmmerapi.wsgi

      - name: Run tests
        run: uv run --frozen pytest -v
